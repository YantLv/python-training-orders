repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: poetry run ruff check --fix
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [python]

      - id: black
        name: Black
        entry: poetry run black
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        pass_filenames: false